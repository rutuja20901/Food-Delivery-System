server:
  port: 8080

spring:

  application:
    name: api-gateway

  cloud:

    gateway:

      server:

        webflux:

          routes:

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/users/**

            - id: restaurant-service
              uri: http://localhost:8082
              predicates:
                - Path=/restaurant/**

            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/payments/**

            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/orders/**